# Optuna sweep over the diffusion model (src/scripts/run_sweep.py, schema
# SweepCfg in src/training/sweep.py). Every trial is one run of
# run_diffusion_train.py with base_config + fixed + the sampled values as --set
# overrides; results in registry/outputs/sweeps/<name>/.
#
# Rerunning this file resumes the study (only n_trials, launcher, poll_seconds
# and stop_timeout_seconds may change in between). For another search space,
# copy the file and give it another name.

name: diffusion_dit_lr_0
phase: diffusion
mode: train
base_config: [configuration_0.yaml]
metric: val_latter_rmse         # a val_ column of history.csv
direction: minimize
n_trials: 30
sampler: tpe
seed: 0
n_startup_trials: 8             # random trials before TPE kicks in

pruning:
  enabled: true
  n_startup_trials: 5           # completed trials before any pruning
  n_warmup_steps: 4             # epochs of a trial before it can be pruned
  interval_steps: 1

# Same value for every trial: a small, quick setting. The dataset
# (preprocessing.*) must already exist, and the VAE is the one
# pretrained_path resolves to (latest: fixed at the creation of the study).
fixed:
  accelerate.num_train_epochs: 20
  accelerate.validate_epoch_interval: 2    # also the step at which the pruner compares trials
  accelerate.checkpointing_steps: 100000000  # only checkpoints/best, no checkpoint-<step>
  accelerate.checkpointing_steps_list: []
  diffusion.n_forecast_examples: 2

# Search space: dotlist keys of src/config.py.
#   float / int:   low, high, optional step or log: true
#   categorical:   choices: a list, or {name: value} for list values
params:
  accelerate.learning_rate: {type: float, low: 5.0e-5, high: 1.0e-3, log: true}
  accelerate.lr_warmup_steps: {type: int, low: 0, high: 1000, step: 250}
  diffusion.network_config.params.depth: {type: int, low: 4, high: 12, step: 2}
  diffusion.network_config.params.hidden_size: {type: categorical, choices: [256, 384, 512]}
  diffusion.network_config.params.num_heads: {type: categorical, choices: [4, 8]}
  diffusion.denoiser_config.params.weighting_config.params.gamma: {type: float, low: 1.0, high: 10.0}
  diffusion.loss_fn_config.params.past_weight: {type: float, low: 0.0, high: 0.3}
